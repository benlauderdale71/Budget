name: Build unsigned Android preview 1.3.0
on:
  push:
    branches: ['build/android-preview-1-3-0']
permissions:
  contents: read
jobs:
  unsigned-preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Compile unsigned preview
        shell: bash
        run: |
          set -eu
          export JAVA_HOME="$JAVA_HOME_21_X64"
          export PATH="$JAVA_HOME/bin:$PATH"
          test -f "$ANDROID_HOME/platforms/android-36/android.jar"
          npm ci --no-audit --no-fund
          npm run build
          bash android/gradlew --no-daemon --max-workers=2 -p android :app:assembleDevRelease -x :app:buildBudgetWeb -PsideBySidePreview=true -PunsignedPreview=true
          apk=android/app/build/outputs/apk/devRelease/app-devRelease-unsigned.apk
          test -f "$apk"
          sha256sum "$apk" > "$apk.sha256"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: budget-1.3.0-unsigned
          retention-days: 1
          if-no-files-found: error
          path: |
            android/app/build/outputs/apk/devRelease/app-devRelease-unsigned.apk
            android/app/build/outputs/apk/devRelease/app-devRelease-unsigned.apk.sha256
