name: Publish Android APKs

on:
  push:
    branches: [main]
    paths:
      - 'downloads/android/**/*.apk'
      - '.github/workflows/publish-android-apk.yml'
      - '.github/scripts/publish_android_apks.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-releases
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify signed APKs and publish GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/publish_android_apks.py
